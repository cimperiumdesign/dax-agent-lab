name: Build DAX Stream Android APK
on:
  push:
    branches: [dax-stream-autoandroid]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-dax-stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "SDKManager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK instalável
        run: gradle --no-daemon assembleDebug
      - name: Publicar arquivo do app
        uses: actions/upload-artifact@v4
        with:
          name: DAX-Stream-Android-AutoUpdate
          path: android-dax-stream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
